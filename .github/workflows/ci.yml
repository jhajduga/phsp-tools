name: Build and test
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  citation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-citation.txt
      - name: Install citation tools
        run: python -m pip install -r .github/requirements-citation.txt
      - name: Check citation metadata and generated references
        run: python .github/scripts/citation.py --check
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: phsp-tools
          environment-file: environment.yml
          channel-priority: strict
      - name: Toolchain versions
        run: |
          "${CONDA_PREFIX}/bin/x86_64-conda-linux-gnu-c++" --version
          root-config --version
          cmake --version
      - name: Configure
        run: cmake --preset conda
      - name: Build
        run: cmake --build --preset conda
      - name: Test
        run: ctest --preset conda
